<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMOTOHI — Clothing Drop</title>
  <meta name="description" content="EMOTOHI clothing drop. Friday 10.16.26 · 12:00 AM HST." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="vendor/fireworks.umd.js"></script>
</head>
<body>
  <div class="site" id="site">
    <img class="site-bg" src="EMOTOHI Clothing Drop Teaser.png" alt="EMOTOHI clothing drop teaser" decoding="async" fetchpriority="high" />
    <div class="site-scrim" aria-hidden="true"></div>

    <header class="site-topbar">
      <span class="site-mark">EMOTOHI</span>
      <div class="site-top-right">
        <a class="site-social" href="https://www.tiktok.com/@emotohi.com" target="_blank" rel="noopener noreferrer">TikTok</a>
        <button class="mute" id="muteBtn" type="button" aria-pressed="false" aria-label="Mute" title="Mute">
          <svg class="vol-on" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg class="vol-off" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="site-content" aria-label="Drop details">
      <p class="site-eyebrow">Dropping in</p>

      <div class="timer" id="countdown" role="timer" aria-live="polite" aria-atomic="true">
        <div class="block">
          <span class="num" data-unit="days">00</span>
          <span class="unit">Days</span>
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="block">
          <span class="num" data-unit="hours">00</span>
          <span class="unit">Hours</span>
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="block">
          <span class="num" data-unit="mins">00</span>
          <span class="unit">Mins</span>
        </div>
        <span class="sep" aria-hidden="true">:</span>
        <div class="block">
          <span class="num" data-unit="secs">00</span>
          <span class="unit">Secs</span>
        </div>
      </div>
    </section>
  </div>

  <div class="final-stage" id="finalStage" hidden>
    <img class="final-bg" src="EMOTOHI Clothing Drop Teaser.png" alt="" aria-hidden="true" />
    <div class="final-scrim" aria-hidden="true"></div>

    <div class="final-topbar">
      <span class="final-mark">EMOTOHI</span>
    </div>

    <div class="final-frame">
      <p class="final-label" id="finalLabel">Dropping in</p>
      <div class="final-num" id="finalNum">30</div>
      <div class="final-bar" aria-hidden="true"><span id="finalBarFill"></span></div>
    </div>
  </div>

  <div id="fwHost" class="fw-host" aria-hidden="true"></div>

  <div class="live-stage" id="liveStage" hidden>
    <img class="live-bg" src="EMOTOHI Clothing Drop Teaser.png" alt="" aria-hidden="true" />
    <div class="live-scrim" aria-hidden="true"></div>

    <div class="live-topbar">
      <span class="live-mark">EMOTOHI</span>
      <span class="live-pin"><span class="live-dot"></span>Live now</span>
    </div>

    <div class="live-content">
      <h1 class="live-headline">The drop<br />is live.</h1>
      <div class="live-actions">
        <a class="live-cta" href="https://emotohi.com" target="_blank" rel="noopener noreferrer">
          Shop the drop
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
